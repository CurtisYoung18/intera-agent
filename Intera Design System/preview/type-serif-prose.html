<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--void);color:var(--mist);padding:22px 26px}
  .cap{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--fog);opacity:.5;margin-bottom:12px;font-weight:700}
  .prose{font-family:var(--font-serif);font-size:18px;line-height:1.6;max-width:560px}
  .meta{font-family:var(--font-mono);font-size:10px;color:var(--smoke);margin-top:12px}
</style></head>
<body>
  <div class="cap">Message prose — Cormorant Garamond, the signature move</div>
  <div class="prose">I've found your order. It shipped on Tuesday and is expected to arrive Friday. Would you like me to send the tracking link to your email?</div>
  <div class="meta">font-serif · 18px · line-height 1.6 — chat bubbles read like print</div>
</body></html>

<!-- @dsCard group="Colors" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--void);color:var(--mist);padding:22px 24px}
  .row{display:flex;gap:14px}
  .sw{flex:1;border-radius:14px;height:84px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:10px 12px}
  .name{font-size:11px;font-weight:600}
  .hex{font-family:var(--font-mono);font-size:10px;opacity:.85;margin-top:2px}
  .cap{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--fog);opacity:.5;margin-bottom:12px;font-weight:700}
</style></head>
<body>
  <div class="cap">Brand expressive — orbs, wordmark, decorative</div>
  <div class="row">
    <div class="sw" style="background:#8b6ff5"><div class="name">lavender ★</div><div class="hex">#8b6ff5</div></div>
    <div class="sw" style="background:#5bb8f7"><div class="name">sky</div><div class="hex">#5bb8f7</div></div>
    <div class="sw" style="background:#b8944c"><div class="name">gold</div><div class="hex">#b8944c</div></div>
    <div class="sw" style="background:#14b8a6"><div class="name">teal</div><div class="hex">#14b8a6</div></div>
  </div>
</body></html>

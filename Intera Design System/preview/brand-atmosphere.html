<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="../assets/liquid-glass.css">
<style>
  html,body{margin:0;height:100%}
  body{font-family:var(--font-sans);color:var(--mist);position:relative;overflow:hidden;height:230px;background:#faf6f0}
  .content{position:relative;z-index:2;padding:26px 28px}
  .cap{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--fog);opacity:.6;font-weight:700}
  .word{font-family:var(--font-serif);font-style:italic;font-weight:500;font-size:56px;letter-spacing:-.02em;margin-top:60px}
  .o{position:absolute;border-radius:50%;filter:blur(70px);opacity:.6}
</style></head>
<body>
  <div class="o" style="width:300px;height:300px;top:-60px;left:-30px;background:radial-gradient(circle,rgba(139,111,245,.4),transparent 70%);animation:float 8s ease-in-out infinite"></div>
  <div class="o" style="width:260px;height:260px;bottom:-80px;right:0;background:radial-gradient(circle,rgba(91,184,247,.32),transparent 70%);animation:float 10s ease-in-out infinite 1s"></div>
  <div class="o" style="width:220px;height:220px;top:30px;right:120px;background:radial-gradient(circle,rgba(184,148,76,.28),transparent 70%);animation:float 9s ease-in-out infinite 2s"></div>
  <div class="liquid-glass-grain" style="opacity:.04"></div>
  <div class="content">
    <div class="cap">Liquid Glass — the signature atmosphere (orbs drift, grain holds)</div>
    <div class="word">Intera</div>
  </div>
</body></html>

<!-- @dsCard group="Components" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--void);color:var(--mist);padding:24px 26px}
  .cap{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--fog);opacity:.5;margin-bottom:16px;font-weight:700}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .pill{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;background:rgba(255,255,255,.5);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.5);font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--fog);box-shadow:0 2px 12px rgba(0,0,0,.04)}
  .dot{width:6px;height:6px;border-radius:50%}
  .ping{position:relative;width:12px;height:12px;display:inline-flex;align-items:center;justify-content:center}
  .ping .ring{position:absolute;inset:0;border-radius:50%;background:rgba(91,138,247,.3);animation:ping 2s ease-out infinite}
  .ping .core{width:6px;height:6px;border-radius:50%;background:var(--indigo);animation:br 1.6s ease-in-out infinite}
  .spin{width:12px;height:12px;border-radius:50%;background:conic-gradient(from 0deg,transparent,#d4912e);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 2px));animation:sp 1s linear infinite}
  @keyframes br{0%,100%{opacity:.4}50%{opacity:1}}
  @keyframes ping{0%{box-shadow:0 0 0 0 rgba(91,138,247,.25)}50%{box-shadow:0 0 0 6px rgba(91,138,247,0)}100%{box-shadow:0 0 0 0 rgba(91,138,247,0)}}
  @keyframes sp{to{transform:rotate(360deg)}}
</style></head>
<body>
  <div class="cap">Status pills — colored dot + tracked micro-label</div>
  <div class="row">
    <div class="pill"><span class="dot" style="background:#2ea04a;animation:br 2s ease-in-out infinite"></span>Intera AI · Online</div>
    <div class="pill"><span class="ping"><span class="ring"></span><span class="core"></span></span>Thinking</div>
    <div class="pill"><span class="spin"></span>Working</div>
    <div class="pill"><span class="dot" style="background:#d4912e"></span>Waiting</div>
    <div class="pill"><span class="dot" style="background:#a09888"></span>Offline</div>
  </div>
</body></html>

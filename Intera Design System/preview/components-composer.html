<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  body{margin:0;font-family:var(--font-sans);background:radial-gradient(ellipse at 50% 0%,#f3edff,#faf6f0 70%);color:var(--mist);padding:30px 26px}
  .cap{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--fog);opacity:.5;margin-bottom:16px;font-weight:700}
  .composer{display:flex;align-items:flex-end;gap:8px;background:rgba(255,255,255,.55);backdrop-filter:blur(20px) saturate(140%);border:1px solid rgba(255,255,255,.5);border-radius:28px;padding:8px 8px 8px 20px;box-shadow:0 1px 4px rgba(0,0,0,.03), 0 0 0 1px rgba(255,255,255,.3) inset;max-width:600px}
  .field{flex:1;border:none;background:transparent;outline:none;font-family:var(--font-serif);font-size:17px;color:var(--mist);padding:10px 0;resize:none}
  .field::placeholder{color:var(--fog);opacity:.35}
  .send{height:44px;width:44px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:999px;background:rgba(91,138,247,.14);color:rgba(91,138,247,.92);box-shadow:inset 0 1px 0 rgba(255,255,255,.55);border:none}
</style></head>
<body>
  <div class="cap">Composer — single frosted pill, serif input, round send</div>
  <div class="composer">
    <textarea class="field" rows="1" placeholder="Describe your issue… (Shift+Enter for new line)"></textarea>
    <button class="send"><i data-lucide="send" style="width:18px;height:18px"></i></button>
  </div>
  <script>lucide.createIcons()</script>
</body></html>

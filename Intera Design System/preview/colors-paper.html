<!-- @dsCard group="Colors" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--void);color:var(--mist);padding:22px 24px}
  .row{display:flex;gap:14px}
  .sw{flex:1;border-radius:14px;height:84px;border:1px solid var(--border-subtle);display:flex;flex-direction:column;justify-content:flex-end;padding:10px 12px;box-shadow:var(--shadow-card)}
  .name{font-size:11px;font-weight:600}
  .hex{font-family:var(--font-mono);font-size:10px;color:var(--fog);margin-top:2px}
  .cap{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--fog);opacity:.5;margin-bottom:12px;font-weight:700}
</style></head>
<body>
  <div class="cap">Paper &amp; surfaces — warm, never pure white</div>
  <div class="row">
    <div class="sw" style="background:#faf6f0"><div class="name">void</div><div class="hex">#faf6f0</div></div>
    <div class="sw" style="background:#f3efe6"><div class="name">abyss</div><div class="hex">#f3efe6</div></div>
    <div class="sw" style="background:#ebe5db"><div class="name">basalt</div><div class="hex">#ebe5db</div></div>
    <div class="sw" style="background:#e4dcd1"><div class="name">obsidian</div><div class="hex">#e4dcd1</div></div>
    <div class="sw" style="background:#f8f7f4"><div class="name">void·console</div><div class="hex">#f8f7f4</div></div>
  </div>
</body></html>

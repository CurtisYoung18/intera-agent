<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="../assets/liquid-glass.css">
<style>
  body{margin:0;font-family:var(--font-sans);color:var(--mist);padding:0;position:relative;overflow:hidden;height:188px}
  .stage{position:absolute;inset:0;background:radial-gradient(ellipse at 30% 30%,#faf6f0,#f1ebe2)}
  .o{position:absolute;border-radius:50%;filter:blur(50px)}
  .oa{width:200px;height:200px;background:radial-gradient(circle,rgba(139,111,245,.5),transparent 70%);top:-40px;left:-20px}
  .ob{width:180px;height:180px;background:radial-gradient(circle,rgba(91,184,247,.4),transparent 70%);bottom:-50px;right:30px}
  .oc{width:150px;height:150px;background:radial-gradient(circle,rgba(184,148,76,.35),transparent 70%);top:40px;right:-20px}
  .content{position:relative;padding:26px 28px}
  .cap{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--fog);opacity:.6;margin-bottom:14px;font-weight:700}
  .glass{display:inline-block;padding:18px 22px;background:rgba(255,255,255,.5);backdrop-filter:blur(24px) saturate(160%);border:1px solid rgba(255,255,255,.6);border-radius:20px;box-shadow:0 2px 16px rgba(0,0,0,.04), 0 0 0 1px rgba(255,255,255,.4) inset;font-family:var(--font-serif);font-size:17px}
</style></head>
<body>
  <div class="stage"><div class="o oa"></div><div class="o ob"></div><div class="o oc"></div></div>
  <div class="content">
    <div class="cap">The material — frosted glass on a drifting orb field</div>
    <div class="glass">rgba(255,255,255,.5) · blur(24px) saturate(160%)</div>
  </div>
</body></html>

<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--void);color:var(--mist);padding:22px 26px}
  .cap{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--fog);opacity:.5;margin-bottom:14px;font-weight:700}
  .row{display:flex;align-items:baseline;gap:14px;margin-bottom:11px}
  .spec{font-family:var(--font-mono);font-size:10px;color:var(--smoke);width:120px;flex-shrink:0}
</style></head>
<body>
  <div class="cap">UI sans — Inter</div>
  <div class="row"><span class="spec">700 · 18px</span><span style="font-weight:700;font-size:18px;letter-spacing:-.01em">Dashboard heading</span></div>
  <div class="row"><span class="spec">600 · 14px</span><span style="font-weight:600;font-size:14px">Section title</span></div>
  <div class="row"><span class="spec">500 · 13px</span><span style="font-weight:500;font-size:13px">Nav item · button label</span></div>
  <div class="row"><span class="spec">400 · 14px</span><span style="font-weight:400;font-size:14px;color:var(--fog)">Body copy and supporting text</span></div>
  <div class="row"><span class="spec">700 · 28px</span><span style="font-weight:700;font-size:28px;letter-spacing:-.02em">1,284</span></div>
</body></html>

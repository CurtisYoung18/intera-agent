<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--void);color:var(--mist);padding:22px 26px}
  .cap{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--fog);opacity:.5;margin-bottom:14px;font-weight:700}
  .row{display:flex;gap:18px;align-items:center}
  .e{text-align:center}
  .bar{height:14px;background:rgba(139,111,245,.14);border-radius:4px;margin-bottom:8px}
  .lab{font-family:var(--font-mono);font-size:10px;color:var(--fog)}
  .note{margin-top:16px;font-size:11px;color:var(--fog);opacity:.7}
</style></head>
<body>
  <div class="cap">Motion easings &amp; durations</div>
  <div class="row">
    <div class="e"><div class="bar" style="width:120px"></div><div class="lab">150ms · press</div></div>
    <div class="e"><div class="bar" style="width:120px"></div><div class="lab">200ms · base</div></div>
    <div class="e"><div class="bar" style="width:120px"></div><div class="lab">300ms · hover</div></div>
    <div class="e"><div class="bar" style="width:120px"></div><div class="lab">500ms · enter</div></div>
  </div>
  <div class="note">glass easing <code style="font-family:var(--font-mono)">cubic-bezier(.22,1,.36,1)</code> · fade-up <code style="font-family:var(--font-mono)">cubic-bezier(.16,1,.3,1)</code> — enter rises, press shrinks 0.96</div>
</body></html>

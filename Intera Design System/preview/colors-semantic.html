<!-- @dsCard group="Colors" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--void);color:var(--mist);padding:22px 24px}
  .row{display:flex;gap:14px}
  .sw{flex:1;border-radius:14px;height:84px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:10px 12px}
  .name{font-size:11px;font-weight:600}
  .role{font-size:10px;opacity:.85}
  .hex{font-family:var(--font-mono);font-size:10px;opacity:.85}
  .cap{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--fog);opacity:.5;margin-bottom:12px;font-weight:700}
</style></head>
<body>
  <div class="cap">Semantic accents — used only with meaning</div>
  <div class="row">
    <div class="sw" style="background:#5b8af7"><div><div class="name">indigo</div><div class="role">primary · focus</div></div><div class="hex">#5b8af7</div></div>
    <div class="sw" style="background:#2ea04a"><div><div class="name">malachite</div><div class="role">success · resolved</div></div><div class="hex">#2ea04a</div></div>
    <div class="sw" style="background:#d4912e"><div><div class="name">amber</div><div class="role">warning · waiting</div></div><div class="hex">#d4912e</div></div>
    <div class="sw" style="background:#e64539"><div><div class="name">vermillion</div><div class="role">error · escalated</div></div><div class="hex">#e64539</div></div>
  </div>
</body></html>

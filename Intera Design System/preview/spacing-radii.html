<!-- @dsCard group="Spacing" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--void);color:var(--mist);padding:22px 24px}
  .cap{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--fog);opacity:.5;margin-bottom:14px;font-weight:700}
  .row{display:flex;gap:16px;align-items:flex-end}
  .box{width:70px;height:70px;background:#fff;border:1px solid var(--border-subtle);box-shadow:var(--shadow-card);display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px}
  .lab{font-family:var(--font-mono);font-size:10px;color:var(--fog)}
  .pill{width:96px;height:38px;border-radius:999px;background:#fff;border:1px solid var(--border-subtle);box-shadow:var(--shadow-card);display:flex;align-items:center;justify-content:center}
</style></head>
<body>
  <div class="cap">Corner radii — soft &amp; generous</div>
  <div class="row">
    <div class="box" style="border-radius:12px"><span class="lab">12 sm</span></div>
    <div class="box" style="border-radius:16px"><span class="lab">16 md</span></div>
    <div class="box" style="border-radius:20px"><span class="lab">20 lg</span></div>
    <div class="box" style="border-radius:24px"><span class="lab">24 xl</span></div>
    <div class="pill"><span class="lab">999 pill</span></div>
  </div>
</body></html>

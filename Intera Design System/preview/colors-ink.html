<!-- @dsCard group="Colors" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--void);color:var(--mist);padding:22px 24px}
  .row{display:flex;gap:14px}
  .sw{flex:1;border-radius:14px;height:84px;border:1px solid var(--border-subtle);display:flex;flex-direction:column;justify-content:flex-end;padding:10px 12px}
  .name{font-size:11px;font-weight:600}
  .hex{font-family:var(--font-mono);font-size:10px;margin-top:2px;opacity:.7}
  .cap{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--fog);opacity:.5;margin-bottom:12px;font-weight:700}
</style></head>
<body>
  <div class="cap">Ink — text tones (never pure black)</div>
  <div class="row">
    <div class="sw" style="background:#1a1814;color:#fff"><div class="name">mist · primary</div><div class="hex">#1a1814</div></div>
    <div class="sw" style="background:#6b6758;color:#fff"><div class="name">fog · secondary</div><div class="hex">#6b6758</div></div>
    <div class="sw" style="background:#a09888;color:#fff"><div class="name">smoke · tertiary</div><div class="hex">#a09888</div></div>
  </div>
</body></html>

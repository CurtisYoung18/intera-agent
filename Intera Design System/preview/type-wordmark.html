<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--void);color:var(--mist);padding:24px 26px}
  .cap{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--fog);opacity:.5;margin-bottom:10px;font-weight:700}
  .word{font-family:var(--font-serif);font-style:italic;font-weight:500;font-size:60px;letter-spacing:-.02em;line-height:1}
  .sub{font-family:var(--font-sans);font-size:14px;color:var(--fog);opacity:.55;margin-top:10px}
  .meta{font-family:var(--font-mono);font-size:10px;color:var(--smoke);margin-top:8px}
</style></head>
<body>
  <div class="cap">Brand wordmark — Cormorant Garamond, italic 500</div>
  <div class="word">Intera</div>
  <div class="sub">How can I help you?</div>
  <div class="meta">font-serif · italic · letter-spacing −0.02em</div>
</body></html>

<!-- @dsCard group="Components" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--void);color:var(--mist);padding:20px 24px}
  .cap{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--fog);opacity:.5;margin-bottom:14px;font-weight:700}
  .nav{width:220px;background:rgba(255,255,255,.5);backdrop-filter:blur(28px);border:1px solid rgba(255,255,255,.5);border-radius:14px;padding:10px}
  .grp{font-size:9px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--fog);opacity:.4;padding:0 8px;margin:4px 0 6px}
  .item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;font-size:13px;color:var(--fog);position:relative;margin-bottom:2px}
  .item.active{background:rgba(0,0,0,.04);color:var(--mist);font-weight:500}
  .item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:2px;height:20px;border-radius:2px}
</style></head>
<body>
  <div class="cap">Sidebar nav — per-item accent + active rail</div>
  <div class="nav">
    <div class="grp">Ops</div>
    <div class="item active" style="--c:#5b8af7"><i data-lucide="message-square" style="width:18px;height:18px;color:#5b8af7"></i>Live Chats</div>
    <div class="item"><i data-lucide="users" style="width:18px;height:18px;opacity:.5"></i>Users</div>
    <div class="item"><i data-lucide="bar-chart-3" style="width:18px;height:18px;opacity:.5"></i>Dashboard</div>
    <div class="grp" style="margin-top:10px">Admin</div>
    <div class="item"><i data-lucide="bot" style="width:18px;height:18px;opacity:.5"></i>Agent Config</div>
    <div class="item"><i data-lucide="shield" style="width:18px;height:18px;opacity:.5"></i>Guardrails</div>
  </div>
  <style>.item.active::before{background:linear-gradient(180deg,#5b8af7,transparent)}</style>
  <script>lucide.createIcons()</script>
</body></html>

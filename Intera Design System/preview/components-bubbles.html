<!-- @dsCard group="Components" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="../assets/liquid-glass.css">
<style>
  body{margin:0;font-family:var(--font-sans);color:var(--mist);padding:24px 26px;background:radial-gradient(ellipse at 70% 20%,#f3edff,#faf6f0 60%)}
  .cap{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--fog);opacity:.5;margin-bottom:16px;font-weight:700}
  .thread{display:flex;flex-direction:column;gap:12px;max-width:560px}
  .b{padding:13px 18px;font-family:var(--font-serif);font-size:17px;line-height:1.55;max-width:78%}
  .assistant{align-self:flex-start;background:rgba(255,255,255,.5);backdrop-filter:blur(24px) saturate(160%);border:1px solid rgba(255,255,255,.6);border-radius:20px;box-shadow:0 2px 16px rgba(0,0,0,.04), 0 0 0 1px rgba(255,255,255,.4) inset}
  .user{align-self:flex-end;background:rgba(139,111,245,.06);backdrop-filter:blur(24px) saturate(160%);border:1px solid rgba(139,111,245,.12);border-radius:20px;box-shadow:0 2px 12px rgba(139,111,245,.04)}
</style></head>
<body>
  <div class="cap">Message bubbles — assistant (white glass) · user (lavender)</div>
  <div class="thread">
    <div class="b user">My order hasn't arrived yet.</div>
    <div class="b assistant">I've located order #4821 — it's out for delivery and arrives today by 6pm.</div>
  </div>
</body></html>

<!-- @dsCard group="Colors" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--void);color:var(--mist);padding:22px 24px}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .chip{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;font-size:12px;font-weight:500}
  .dot{width:8px;height:8px;border-radius:999px}
  .cap{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--fog);opacity:.5;margin-bottom:14px;font-weight:700}
</style></head>
<body>
  <div class="cap">Accent tints — rgba(accent, .04–.12) fills + matching border</div>
  <div class="row">
    <div class="chip" style="background:rgba(91,138,247,.09);color:#5b8af7;border:1px solid rgba(91,138,247,.2)"><span class="dot" style="background:#5b8af7"></span>In progress</div>
    <div class="chip" style="background:rgba(46,160,74,.09);color:#2ea04a;border:1px solid rgba(46,160,74,.2)"><span class="dot" style="background:#2ea04a"></span>Resolved</div>
    <div class="chip" style="background:rgba(212,145,46,.11);color:#d4912e;border:1px solid rgba(212,145,46,.22)"><span class="dot" style="background:#d4912e"></span>Waiting</div>
    <div class="chip" style="background:rgba(230,69,57,.08);color:#e64539;border:1px solid rgba(230,69,57,.22)"><span class="dot" style="background:#e64539"></span>Escalated</div>
    <div class="chip" style="background:rgba(139,111,245,.06);color:#8b6ff5;border:1px solid rgba(139,111,245,.18)"><span class="dot" style="background:#8b6ff5"></span>User</div>
  </div>
</body></html>

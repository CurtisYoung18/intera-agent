<!-- @dsCard group="Components" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--void);color:var(--mist);padding:24px 26px}
  .cap{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--fog);opacity:.5;margin-bottom:16px;font-weight:700}
  .field{margin-bottom:14px;max-width:560px}
  .lab{font-size:11px;font-weight:600;color:var(--mist);margin-bottom:6px;display:block}
  .input{width:100%;box-sizing:border-box;background:rgba(255,255,255,.55);backdrop-filter:blur(12px);border:1px solid rgba(0,0,0,.06);border-radius:8px;box-shadow:inset 0 1px 3px rgba(0,0,0,.04);padding:10px 14px;font-size:14px;color:var(--mist);outline:none;font-family:var(--font-sans)}
  .input.focus{border-color:rgba(91,138,247,.4);box-shadow:inset 0 1px 3px rgba(0,0,0,.04), 0 0 0 3px rgba(91,138,247,.08)}
  .input::placeholder{color:var(--smoke);opacity:.6}
</style></head>
<body>
  <div class="cap">Form inputs — inset glass, indigo focus ring</div>
  <div class="field"><label class="lab">Organization name</label><input class="input" value="Acme Support"></div>
  <div class="field"><label class="lab">API key</label><input class="input focus" placeholder="Enter your GPTBots key…"></div>
</body></html>

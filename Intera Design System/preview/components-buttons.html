<!-- @dsCard group="Components" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--void);color:var(--mist);padding:24px 26px}
  .cap{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--fog);opacity:.5;margin-bottom:16px;font-weight:700}
  .row{display:flex;gap:14px;align-items:center}
  /* primary send */
  .send{height:44px;width:44px;display:flex;align-items:center;justify-content:center;border-radius:999px;background:rgba(91,138,247,.14);color:rgba(91,138,247,.92);box-shadow:inset 0 1px 0 rgba(255,255,255,.55);border:none;cursor:pointer;transition:.15s var(--ease-glass)}
  .send:hover{background:rgba(91,138,247,.22)}
  .solid{height:38px;padding:0 18px;border-radius:12px;background:var(--indigo);color:#fff;font-size:13px;font-weight:600;border:none;cursor:pointer}
  .ghost{height:38px;padding:0 16px;border-radius:12px;background:rgba(255,255,255,.72);border:1px solid rgba(0,0,0,.06);color:var(--fog);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:7px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .icon{height:40px;width:40px;border-radius:12px;background:rgba(255,255,255,.7);border:1px solid rgba(0,0,0,.06);color:var(--fog);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .toolbar{display:inline-flex;align-items:center;gap:6px;border-radius:12px;border:1px solid rgba(139,111,245,.12);background:rgba(139,111,245,.04);padding:8px 11px;font-size:12px;font-weight:600;color:var(--fog);cursor:pointer}
</style></head>
<body>
  <div class="cap">Buttons</div>
  <div class="row">
    <button class="send"><i data-lucide="send" style="width:18px;height:18px"></i></button>
    <button class="solid">Login</button>
    <button class="ghost"><i data-lucide="chevron-left" style="width:14px;height:14px"></i>Back</button>
    <button class="icon"><i data-lucide="pen-line" style="width:16px;height:16px"></i></button>
    <button class="toolbar"><i data-lucide="download" style="width:14px;height:14px"></i>Export</button>
  </div>
  <script>lucide.createIcons()</script>
</body></html>

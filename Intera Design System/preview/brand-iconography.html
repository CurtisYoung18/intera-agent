<!-- @dsCard group="Brand" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--void);color:var(--mist);padding:22px 26px}
  .cap{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--fog);opacity:.5;margin-bottom:6px;font-weight:700}
  .sub{font-size:11px;color:var(--fog);opacity:.7;margin-bottom:16px}
  .row{display:flex;gap:22px;flex-wrap:wrap}
  .ico{display:flex;flex-direction:column;align-items:center;gap:7px;color:var(--fog)}
  .ico span{font-family:var(--font-mono);font-size:9px;opacity:.6}
</style></head>
<body>
  <div class="cap">Iconography — Lucide, stroke 1.5–2, inherits accent when active</div>
  <div class="sub">One icon language. No second set, no glyph font, no emoji.</div>
  <div class="row">
    <div class="ico"><i data-lucide="message-square" style="width:24px;height:24px;color:#5b8af7"></i><span>chats</span></div>
    <div class="ico"><i data-lucide="users" style="width:24px;height:24px;color:#8b6ff5"></i><span>users</span></div>
    <div class="ico"><i data-lucide="bar-chart-3" style="width:24px;height:24px;color:#14b8a6"></i><span>dashboards</span></div>
    <div class="ico"><i data-lucide="bot" style="width:24px;height:24px;color:#2ea04a"></i><span>agent</span></div>
    <div class="ico"><i data-lucide="puzzle" style="width:24px;height:24px;color:#5b8af7"></i><span>tools</span></div>
    <div class="ico"><i data-lucide="shield" style="width:24px;height:24px;color:#e64539"></i><span>guardrails</span></div>
    <div class="ico"><i data-lucide="layers" style="width:24px;height:24px;color:#d4912e"></i><span>case-types</span></div>
    <div class="ico"><i data-lucide="search" style="width:24px;height:24px;color:#14b8a6"></i><span>knowledge</span></div>
    <div class="ico"><i data-lucide="plug" style="width:24px;height:24px;color:#7c3aed"></i><span>channels</span></div>
    <div class="ico"><i data-lucide="book-open" style="width:24px;height:24px;color:#8b6ff5"></i><span>guide</span></div>
  </div>
  <script>lucide.createIcons()</script>
</body></html>

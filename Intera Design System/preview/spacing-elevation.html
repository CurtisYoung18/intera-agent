<!-- @dsCard group="Spacing" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--void);color:var(--mist);padding:26px 24px}
  .cap{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--fog);opacity:.5;margin-bottom:18px;font-weight:700}
  .row{display:flex;gap:24px;align-items:center}
  .col{text-align:center}
  .box{width:120px;height:62px;background:#fff;border:1px solid var(--border-subtle);border-radius:14px;margin-bottom:10px}
  .lab{font-family:var(--font-mono);font-size:10px;color:var(--fog)}
  .b1{box-shadow:0 2px 12px rgba(0,0,0,0.04), 0 0 0 1px rgba(255,255,255,0.5) inset}
  .b2{box-shadow:0 4px 20px rgba(0,0,0,0.06), 0 0 0 1px rgba(255,255,255,0.7) inset}
  .b3{box-shadow:var(--shadow-glow);border-color:rgba(91,138,247,.25)}
  .b4{box-shadow:inset 0 1px 3px rgba(0,0,0,0.04);background:rgba(255,255,255,.55)}
</style></head>
<body>
  <div class="cap">Elevation — low, warm, blur-driven</div>
  <div class="row">
    <div class="col"><div class="box b1"></div><div class="lab">card</div></div>
    <div class="col"><div class="box b2"></div><div class="lab">card · hover</div></div>
    <div class="col"><div class="box b3"></div><div class="lab">glow</div></div>
    <div class="col"><div class="box b4"></div><div class="lab">input · inset</div></div>
  </div>
</body></html>

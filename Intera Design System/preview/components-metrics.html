<!-- @dsCard group="Components" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--void);color:var(--mist);padding:22px 26px}
  .cap{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--fog);opacity:.5;margin-bottom:14px;font-weight:700}
  .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;max-width:620px}
  .metric{background:rgba(255,255,255,.6);backdrop-filter:blur(16px);border:1px solid rgba(0,0,0,.06);border-radius:16px;padding:16px}
  .mh{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .ic{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center}
  .ml{font-size:11px;font-weight:600;color:var(--fog)}
  .mv{font-size:28px;font-weight:700;letter-spacing:-.02em}
</style></head>
<body>
  <div class="cap">Metric cards — console dashboard</div>
  <div class="grid">
    <div class="metric"><div class="mh"><div class="ic" style="background:rgba(91,138,247,.08)"><i data-lucide="message-square" style="width:16px;height:16px;color:#5b8af7"></i></div><span class="ml">Messages (24h)</span></div><div class="mv">1,284</div></div>
    <div class="metric"><div class="mh"><div class="ic" style="background:rgba(212,145,46,.08)"><i data-lucide="briefcase" style="width:16px;height:16px;color:#d4912e"></i></div><span class="ml">Active Cases</span></div><div class="mv">37</div></div>
    <div class="metric"><div class="mh"><div class="ic" style="background:rgba(46,160,74,.08)"><i data-lucide="clock" style="width:16px;height:16px;color:#2ea04a"></i></div><span class="ml">Avg Resolution</span></div><div class="mv">4.2<span style="font-size:14px;color:var(--fog);font-weight:500"> min</span></div></div>
  </div>
  <script>lucide.createIcons()</script>
</body></html>

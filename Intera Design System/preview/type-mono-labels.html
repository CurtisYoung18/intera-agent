<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--void);color:var(--mist);padding:22px 26px}
  .cap{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--fog);opacity:.5;margin-bottom:14px;font-weight:700}
  .row{display:flex;align-items:center;gap:16px;margin-bottom:13px}
  .spec{font-family:var(--font-mono);font-size:10px;color:var(--smoke);width:90px;flex-shrink:0}
  .ey{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--fog)}
  .pill{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--indigo)}
  .mono{font-family:var(--font-mono);font-size:12px;color:var(--fog)}
</style></head>
<body>
  <div class="cap">Mono &amp; labels</div>
  <div class="row"><span class="spec">eyebrow</span><span class="ey">Ops · Admin</span></div>
  <div class="row"><span class="spec">status</span><span class="pill">Online · Thinking</span></div>
  <div class="row"><span class="spec">mono · id</span><span class="mono">JAYA113C88F · v0.4.2 · 3h ago</span></div>
</body></html>

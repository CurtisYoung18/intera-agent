# Local dev database for Intera (safe-local-DB foundation, 2026-06-08).
# Usage: docker compose up -d postgres  → Postgres 16 on host port 5434.
# Point .env.local + packages/shared/.env DATABASE_URL at postgresql://intera:intera@localhost:5434/intera
services:
  postgres:
    image: postgres:16
    container_name: intera-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: intera
      POSTGRES_PASSWORD: intera
      POSTGRES_DB: intera
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intera -d intera"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

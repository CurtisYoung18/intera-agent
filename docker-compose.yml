version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: intera-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: intera
      POSTGRES_PASSWORD: intera
      POSTGRES_DB: intera
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intera -d intera"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
